
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #198754;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
            color: #333;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button, .back {
            display: block;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            margin-top: 18px;
        }

        button {
            background: #198754;
            color: white;
        }

        button:hover {
            background: #146c43;
        }

        .back {
            background: #6c757d;
            color: white;
        }

        .back:hover {
            background: #565e64;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📚 Issue a Book</h2>
    <p class="subtitle">Select a student and a book</p>

    <form method="POST">
        {% csrf_token %}

        <label for="student">Select Student</label>
        <select name="student" id="student" required>
            <option value="">-- Select Student --</option>

            {% for student in students %}
                <option value="{{ student.id }}">
                    {{ student.name }} ({{ student.student_id }})
                </option>
            {% endfor %}
        </select>

        <label for="book">Select Book</label>
        <select name="book" id="book" required>
            <option value="">-- Select Book --</option>

            {% for book in books %}
                <option value="{{ book.id }}">
                    {{ book.title }} (Available: {{ book.quantity }})
                </option>
            {% endfor %}
        </select>

        <button type="submit">Issue Book</button>
    </form>

    <a href="{% url 'home' %}" class="back">
        Back to Dashboard
    </a>

</div>

</body>
</html>
