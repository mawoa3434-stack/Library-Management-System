
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Book | My Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: #176b45;
            color: white;
            padding: 22px 35px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 550px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .delete-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #00000012;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #d83b3b;
            margin-bottom: 15px;
        }

        .message {
            color: #666;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .book-name {
            display: block;
            background: #fff0f0;
            color: #c62828;
            padding: 13px;
            border-radius: 7px;
            font-weight: bold;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .warning {
            color: #b45309;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .delete-button {
            background: #d83b3b;
        }

        .delete-button:hover {
            background: #b92727;
        }

        .cancel-button {
            background: #777;
        }

        .cancel-button:hover {
            background: #555;
        }

        @media (max-width: 500px) {
            .container {
                margin: 35px auto;
            }

            .delete-box {
                padding: 25px 18px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📚 My Library</h1>
        <p>Library Book Management System</p>
    </div>

    <div class="container">

        <div class="delete-box">

            <div class="icon">⚠️</div>

            <h2>Delete Book?</h2>

            <p class="message">
                Are you sure you want to delete this book?
            </p>

            <div class="book-name">
                {{ book.title }}
            </div>

            <p class="warning">
                This action cannot be undone!
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="buttons">

                    <button type="submit" class="button delete-button">
                        🗑️ Yes, Delete
                    </button>

                    <a href="{% url 'book_list' %}" class="button cancel-button">
                        Cancel
                    </a>

                </div>
            </form>

        </div>

    </div>

</body>
</html>
