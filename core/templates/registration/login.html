
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #198754;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #198754;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            color: #dc3545;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">📚</div>

    <h2>My Library</h2>
    <p class="subtitle">Login to your account</p>

    <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
            <p class="error">
                Invalid username or password. Please try again.
            </p>
        {% endif %}

        <label for="id_username">Username</label>
        <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Enter your username"
            required
            autofocus
        >

        <label for="id_password">Password</label>
        <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Enter your password"
            required
        >

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Login</button>
    </form>

    <div class="register">
        Don't have an account?
        <a href="{% url 'register' %}">Register Now</a>
    </div>

</div>

</body>
</html>
