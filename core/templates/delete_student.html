
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .warning {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .student-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
        }

        .student-info p {
            margin: 7px 0;
            color: #333;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        button, .cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #dc3545;
            color: white;
        }

        button:hover {
            background: #b02a37;
        }

        .cancel {
            background: #6c757d;
            color: white;
        }

        .cancel:hover {
            background: #565e64;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="warning">⚠️</div>

    <h2>Delete Student?</h2>

    <p>
        Are you sure you want to delete this student?
        This action cannot be undone.
    </p>

    <div class="student-info">
        <p><strong>Name:</strong> {{ student.name }}</p>
        <p><strong>Student ID:</strong> {{ student.student_id }}</p>
        <p><strong>Department:</strong> {{ student.department }}</p>
        <p><strong>Phone:</strong> {{ student.phone }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="buttons">
            <button type="submit">Yes, Delete</button>

            <a href="{% url 'student_list' %}" class="cancel">
                Cancel
            </a>
        </div>
    </form>

</div>

</body>
</html>
