
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | My Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #333;
        }

        header {
            background: #176b45;
            color: white;
            padding: 22px 35px;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h2 {
            color: #176b45;
        }

        a {
            text-decoration: none;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            color: white;
            background: #176b45;
            margin: 3px;
        }

        .edit {
            background: #2878c8;
        }

        .delete {
            background: #dc3545;
        }

        .search {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .search input {
            padding: 11px;
            width: 70%;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #176b45;
            color: white;
        }

        .table-box {
            overflow-x: auto;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #176b45;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 My Library</h1>
    <p>Library Book Management System</p>
</header>

<div class="container">

    <div class="top">
        <h2>📖 Library Book List</h2>
        <a href="{% url 'add_book' %}" class="btn">
            ➕ Add New Book
        </a>
    </div>

    <form method="GET" class="search">
        <input
            type="text"
            name="q"
            placeholder="Search by book name or author"
            value="{{ request.GET.q }}"
        >
        <button type="submit" class="btn">🔍 Search</button>
        <a href="{% url 'book_list' %}" class="btn" style="background:#777;">
            Clear
        </a>
    </form>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for book in books %}
                <tr>
                    <td><strong>{{ book.title }}</strong></td>
                    <td>{{ book.author }}</td>
                    <td>{{ book.isbn }}</td>
                    <td>{{ book.quantity }}</td>
                    <td>
                        <a href="{% url 'edit_book' book.id %}"
                           class="btn edit">Edit</a>

                        <a href="{% url 'delete_book' book.id %}"
                           class="btn delete">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5">No books found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <a href="{% url 'home' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
